<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Techsavvy Tanzania</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Techsavvy Tanzania" class="brand-logo"></a>
  </div>
</header>

<main>
  <section class="section" style="padding-top:70px;">
    <div class="wrap form-card">
      <span class="pill">Admin</span>
      <h1>Admin Login</h1>
      <form id="login-form" style="margin-top:20px;">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="form-submit">Log In</button>
        <p class="form-status" id="login-status"></p>
      </form>
    </div>
  </section>
</main>

<script src="assets/supabase-config.js"></script>
<script>
const loginStatus = document.getElementById("login-status");

async function isAdminUser() {
  const { data, error } = await supabaseClient.rpc("is_admin");
  if (error) throw error;
  return data === true;
}

// If already logged in as an admin, go straight to the dashboard
(async function checkSession() {
  try {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session && (await isAdminUser())) window.location.href = "admin.html";
  } catch (err) {
    console.error(err);
  }
})();

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  loginStatus.textContent = "Logging in...";
  loginStatus.className = "form-status";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;

    if (!(await isAdminUser())) {
      await supabaseClient.auth.signOut();
      loginStatus.textContent = "This account does not have admin access.";
      loginStatus.className = "form-status error";
      return;
    }

    window.location.href = "admin.html";
  } catch (err) {
    console.error(err);
    loginStatus.textContent = "Login failed: " + (err && err.message ? err.message : err);
    loginStatus.className = "form-status error";
  }
});
</script>
</body>
</html>
