      ["What Artificial Intelligence Is and Is Not","AI ni Nini na Si Nini","Define AI, distinguish narrow AI from general AI, and classify real tasks.","Eleza AI, tofautisha AI maalumu na AI ya jumla, na ainisha kazi halisi.","Classify tasks and explain why AI is a tool rather than a person.","Ainisha kazi na eleza kwa nini AI ni zana, si mtu."],

    {en:"Machine Learning and Large Language Models",sw:"Ujifunzaji wa Mashine na Modeli Kubwa za Lugha",focus:["Patterns, features, neural networks and model errors","Mifumo, vipengele, mitandao ya neva na makosa ya modeli"],time:"4–6",purpose:["Understand what models learn and where their predictions fail.","Kuelewa modeli zinavyojifunza na utabiri unapoweza kukosea."],outcomes:[["Identify features and predictions.","Explain the basic role of neural networks and LLMs.","Recognize error and uncertainty."],["Tambua vipengele na utabiri.","Eleza jukumu la msingi la mitandao ya neva na modeli za lugha.","Tambua makosa na kutokuwa na uhakika."]],lessons:[

      ["ChatGPT as a Conversational AI Tool","ChatGPT kama Zana ya AI ya Mazungumzo","Explore conversational input, context and human review.","Chunguza mazungumzo, muktadha na ukaguzi wa binadamu.","Plan a safe, specific interaction with ChatGPT.","Panga mazungumzo salama na yenye maelekezo mahsusi."],

}
function renderLesson(m,l){
 const item=course.modules[m],lesson=item.lessons[l],i=langIndex(),k=key(m,l), f=full[l];
 let intro=`<div class="crumb"><span>${esc(tr("curriculum"))}</span><span aria-hidden="true">›</span><span>${esc(item[state.lang])}</span><span aria-hidden="true">›</span><span>${esc(tr("lesson"))} ${m*3+l+1}</span></div><div class="kicker">${esc(tr("lesson"))} ${m*3+l+1} / 30</div><h2>${esc(lesson[i])}</h2><p class="muted">${esc(lesson[i===0?2:3])}</p>`;
 if(m!==0)return `<article class="panel">${intro}<p class="badge pending">${esc(tr("future"))}</p>${card(tr("lessonPurpose"),`<p>${esc(lesson[i===0?2:3])}</p>`,true)}${card(tr("lessonOutcome"),`<p>${esc(lesson[i===0?4:5])}</p>`)}<p class="privacy">${esc(tr("futureNotice"))}</p>${m===9?card(tr("finalPlan"),`<p>${esc(tr("finalText"))}</p>`):""}${lessonPager(m,l)}</article>`;
 return `<article class="panel">${intro}<p class="badge">${esc(tr("available"))}</p>${l===0?renderOverview():""}
 ${card(tr("explanation"),`<p>${esc(f.overview[state.lang])}</p>${f.explanation[state.lang].map(x=>`<p>${esc(x)}</p>`).join("")}`,true)}
 ${card(tr("objectives"),list(f.objectives[state.lang]))}
 ${card(tr("examples"),f.examples[state.lang].map(x=>`<p>${esc(x)}</p>`).join(""))}
 ${card(tr("demo"),list(f.demo[state.lang],true),true)}
 ${card(tr("activity"),`<p>${esc(f.activity[state.lang])}</p><p class="privacy">${esc(tr("privacy"))}</p><label class="checkline"><input type="checkbox" data-toggle="activities" ${state.activities[k]?"checked":""}><span>${esc(tr("activityDone"))}</span></label>`)}
 ${card(tr("exercise"),`<p>${esc(f.exercise[state.lang])}</p><label class="checkline"><input type="checkbox" data-toggle="exercises" ${state.exercises[k]?"checked":""}><span>${esc(tr("exerciseDone"))}</span></label><label for="notes" class="block font-bold mb-2">${esc(tr("notes"))}</label><textarea id="notes" class="field" maxlength="12000">${esc(state.notes[k]||"")}</textarea><button type="button" class="btn btn-outline mt-2" data-save-notes="1">${esc(tr("saveNotes"))}</button><p id="note-status" role="status"></p>`)}
 ${card(tr("takeaways"),list(f.takeaways[state.lang]),true)}
 ${card(tr("check"),`<p>${esc(tr("score"))}: ${[0,1,2].filter(q=>state.checks[`${k}-${q}`]).length}/3</p>${[0,1,2].map(q=>renderQuestion(m,l,q)).join("")}`)}
 ${card(tr("further"),`<p>${esc(f.further[state.lang])}</p>`)}
 <label class="checkline"><input type="checkbox" data-toggle="lessons" ${state.lessons[k]?"checked":""}><span>${esc(tr("markLesson"))}</span></label>
 ${l===2?`<button class="btn btn-outline mt-3" data-assignment="1" type="button">${esc(tr("assignment"))} →</button>`:""}${lessonPager(m,l)}</article>`;
}
function renderAssignment(){
 let rows=tr("rubricRows");
 return `<article class="panel"><div class="crumb">${esc(course.modules[0][state.lang])} › ${esc(tr("assignment"))}</div><h2>${esc(tr("assignment"))}</h2><p>${esc(tr("assignmentBrief"))}</p>
 ${card(tr("requirements"),list(tr("requirementsList"),true),true)}
 ${card(tr("submission"),`<p>${esc(tr("submissionText"))}</p><p class="privacy">${esc(tr("privacy"))}</p>`)}
 ${card(tr("rubric"),`<div class="table-scroll"><table><thead><tr><th scope="col">${esc(tr("rubric"))}</th><th scope="col">/100</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div><p>${esc(tr("pass"))}</p>`)}
 ${card(tr("checklist"),list(tr("checklistItems")))}
 <label class="checkline"><input type="checkbox" data-assignment-toggle="1" ${state.assignment?"checked":""}><span>${esc(tr("assignmentDone"))}</span></label><button type="button" class="btn btn-outline mt-3" data-go="0,2">${esc(tr("previous"))}</button></article>`;
}
function render(){
 renderChrome(); renderSidebar();
 $("content").innerHTML=view.type==="home"?renderHome():view.type==="curriculum"?renderCurriculum():view.type==="assignment"?renderAssignment():renderLesson(view.m,view.l);
}
function navigate(type,m=0,l=0){
 view={type,m,l};resetOpen=false;render();$("main").focus({preventScroll:true});$("main").scrollIntoView({behavior:"smooth",block:"start"});
}
function refreshProgress(){
 renderChrome();renderSidebar();
 if(view.type==="home"||view.type==="curriculum") $("content").innerHTML=view.type==="home"?renderHome():renderCurriculum();
}
$("home-nav").addEventListener("click",()=>navigate("home"));
$("curriculum-nav").addEventListener("click",()=>navigate("curriculum"));
$("continue-btn").addEventListener("click",()=>{
 let l=[0,1,2].find(i=>!state.lessons[key(0,i)]||!state.activities[key(0,i)]||!state.exercises[key(0,i)]||[0,1,2].some(q=>!state.checks[`${key(0,i)}-${q}`]));
 navigate(l===undefined?"assignment":"lesson",0,l??0);
});
for(const code of ["en","sw"])$(code==="en"?"lang-en":"lang-sw").addEventListener("click",()=>{state.lang=code;save();render();});
$("search").addEventListener("input",e=>{
 searchTerm=e.target.value.trim();
 if(view.type==="home"&&searchTerm)view={type:"curriculum",m:0,l:0};
 renderChrome();renderSidebar();$("content").innerHTML=view.type==="curriculum"?renderCurriculum():view.type==="home"?renderHome():view.type==="assignment"?renderAssignment():renderLesson(view.m,view.l);
});
document.addEventListener("click",e=>{
 const target=e.target.closest("button");if(!target)return;
 if(target.dataset.go){let [m,l]=target.dataset.go.split(",").map(Number);navigate("lesson",m,l);}
 else if(target.dataset.home)navigate("home");
 else if(target.dataset.assignment)navigate("assignment");
 else if(target.dataset.resetOpen){resetOpen=true;render();}
 else if(target.dataset.resetCancel){resetOpen=false;render();}
 else if(target.dataset.resetConfirm){let language=state.lang;state=blank();state.lang=language;save();navigate("home");}
 else if(target.dataset.saveNotes&&view.type==="lesson"){state.notes[key(view.m,view.l)]=$("notes").value;save();$("note-status").textContent=tr("saved");}
 else if(target.dataset.check!==undefined&&view.type==="lesson"&&view.m===0){
   let q=Number(target.dataset.check), field=target.closest("fieldset"),selected=field.querySelector("input:checked"),feedback=field.querySelector(".feedback");
   if(!selected){feedback.hidden=false;feedback.textContent=tr("choose");return;}
   let correct=Number(selected.value)===full[view.l].questions[q].correct, id=`${key(0,view.l)}-${q}`;
   if(correct){state.checks[id]=true;save();}
   feedback.hidden=false;feedback.textContent=`${tr(correct?"correct":"incorrect")} ${correct?full[view.l].questions[q].why[langIndex()]:""}`;
   target.textContent=correct?tr("submitAnswer"):tr("retry");
   refreshProgress();
 }
});
document.addEventListener("change",e=>{
 if(e.target.dataset.toggle&&view.type==="lesson"){state[e.target.dataset.toggle][key(view.m,view.l)]=e.target.checked;save();refreshProgress();}
 if(e.target.dataset.assignmentToggle){state.assignment=e.target.checked;save();refreshProgress();}
});
render();
</script>
 
</body></html>
