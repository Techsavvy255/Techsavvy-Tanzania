<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Announcements | Techsavvy Tanzania</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #fff;
      font-family: "Inter", sans-serif;
      min-height: 100vh;
    }

    .layout {
      min-height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 250px;

      background: #0b0b0b;
      border-right: 1px solid #1d1d1d;

      padding: 25px 15px;

      z-index: 20;
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-size: 21px;
      font-weight: 700;
      padding: 0 12px 30px;
    }

    .logo span {
      color: #3974ff;
    }

    .menu {
      display: grid;
      gap: 7px;
    }

    .menu a {
      color: #888;
      text-decoration: none;

      padding: 13px 14px;

      border-radius: 9px;

      font-size: 14px;

      display: flex;
      align-items: center;
      gap: 10px;

      transition: 0.25s;
    }

    .menu a:hover,
    .menu a.active {
      background: #151515;
      color: #fff;
    }

    .menu a.active {
      border-left: 3px solid #3974ff;
    }

    .logout {
      position: absolute;

      bottom: 25px;
      left: 15px;
      right: 15px;

      width: calc(100% - 30px);

      padding: 12px;

      border: 1px solid #242424;
      border-radius: 9px;

      background: #101010;
      color: #aaa;

      cursor: pointer;
      font-family: inherit;
    }

    .logout:hover {
      color: #fff;
      border-color: #3974ff;
    }

    /* MAIN */

    .main {
      margin-left: 250px;

      min-height: 100vh;

      padding: 35px;
    }

    .mobile-header {
      display: none;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      margin-bottom: 35px;
    }

    .topbar h1 {
      font-family: "Space Grotesk", sans-serif;

      font-size: 34px;
    }

    .topbar p {
      color: #777;

      font-size: 14px;

      margin-top: 7px;

      line-height: 1.6;
    }

    .member-badge {
      padding: 9px 15px;

      border-radius: 50px;

      background: rgba(49,105,255,0.1);

      border: 1px solid rgba(49,105,255,0.2);

      color: #6790ff;

      font-size: 11px;

      font-weight: 700;
    }

    /* ANNOUNCEMENTS */

    .announcement-list {
      max-width: 950px;

      display: grid;

      gap: 18px;
    }

    .announcement {
      background: #0c0c0c;

      border: 1px solid #1e1e1e;

      border-radius: 16px;

      padding: 25px;

      transition: 0.25s;
    }

    .announcement:hover {
      border-color: #303030;

      transform: translateY(-2px);
    }

    .announcement-top {
      display: flex;

      align-items: flex-start;

      gap: 16px;
    }

    .announcement-icon {
      width: 48px;
      height: 48px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: rgba(47,103,240,0.12);

      border: 1px solid rgba(47,103,240,0.2);

      font-size: 21px;
    }

    .announcement-content {
      flex: 1;
    }

    .announcement h2 {
      font-family: "Space Grotesk", sans-serif;

      font-size: 20px;

      margin-bottom: 8px;
    }

    .announcement p {
      color: #999;

      font-size: 14px;

      line-height: 1.7;
    }

    .meta {
      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 18px;

      padding-top: 15px;

      border-top: 1px solid #1d1d1d;

      color: #666;

      font-size: 11px;
    }

    .tag {
      padding: 5px 9px;

      border-radius: 50px;

      background: #151515;

      color: #777;
    }

    /* EMPTY */

    .empty {
      max-width: 700px;

      padding: 70px 25px;

      text-align: center;

      background: #0c0c0c;

      border: 1px solid #1e1e1e;

      border-radius: 16px;
    }

    .empty-icon {
      font-size: 42px;

      margin-bottom: 15px;
    }

    .empty h2 {
      font-family: "Space Grotesk", sans-serif;

      font-size: 22px;

      margin-bottom: 8px;
    }

    .empty p {
      color: #777;

      font-size: 13px;

      line-height: 1.6;
    }

    .loading {
      color: #777;

      padding: 60px 0;
    }

    .spinner {
      width: 30px;
      height: 30px;

      margin-bottom: 15px;

      border-radius: 50%;

      border: 3px solid #222;

      border-top-color: #3974ff;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .sidebar {
        display: none;
      }

      .main {
        margin-left: 0;

        padding: 20px;
      }

      .mobile-header {
        display: flex;

        align-items: center;

        justify-content: space-between;

        margin-bottom: 25px;
      }

      .mobile-logo {
        font-family: "Space Grotesk", sans-serif;

        font-weight: 700;
      }

      .mobile-logo span {
        color: #3974ff;
      }

      .mobile-header a {
        color: #aaa;

        text-decoration: none;

        font-size: 13px;
      }

      .member-badge {
        display: none;
      }

      .topbar h1 {
        font-size: 28px;
      }

      .announcement {
        padding: 20px;
      }

      .announcement-top {
        gap: 12px;
      }

      .announcement-icon {
        width: 42px;
        height: 42px;

        font-size: 18px;
      }

      .announcement h2 {
        font-size: 18px;
      }

    }

  </style>
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">
      TECH<span>SAVVY</span>
    </div>

    <nav class="menu">

      <a href="dashboard.html">
        🏠 Dashboard
      </a>

      <a href="courses.html">
        📚 My Courses
      </a>

      <a href="dashboard.html#projects">
        🚀 Projects
      </a>

      <a href="profile.html">
        👤 My Profile
      </a>

      <a
        href="announcements.html"
        class="active"
      >
        📢 Announcements
      </a>

    </nav>

    <button
      class="logout"
      id="logoutBtn"
    >
      ↪ Logout
    </button>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <div class="mobile-header">

      <div class="mobile-logo">
        TECH<span>SAVVY</span>
      </div>

      <a href="dashboard.html">
        ← Dashboard
      </a>

    </div>


    <div class="topbar">

      <div>

        <h1>
          Announcements
        </h1>

        <p>
          Habari, updates na taarifa muhimu kutoka
          Techsavvy Tanzania.
        </p>

      </div>

      <div class="member-badge">
        TECHSAVVY MEMBER
      </div>

    </div>


    <!-- LOADING -->

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      Loading announcements...

    </div>


    <!-- ANNOUNCEMENTS -->

    <div
      id="announcementList"
      class="announcement-list"
      style="display:none;"
    >
    </div>

  </main>

</div>


<script>

  /* ==========================================
     SUPABASE CONFIG
     ========================================== */

  const SUPABASE_URL =
    "WEKA_SUPABASE_URL_HAPA";

  const SUPABASE_KEY =
    "WEKA_SUPABASE_PUBLISHABLE_KEY_HAPA";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     ELEMENTS
     ========================================== */

  const loading =
    document.getElementById("loading");

  const announcementList =
    document.getElementById(
      "announcementList"
    );


  /* ==========================================
     LOAD USER
     ========================================== */

  async function checkUser() {

    const {
      data,
      error
    } =
    await supabaseClient.auth.getUser();


    if (
      error ||
      !data.user
    ) {

      window.location.href =
        "login.html";

      return false;

    }

    return true;

  }


  /* ==========================================
     LOAD ANNOUNCEMENTS
     ========================================== */

  async function loadAnnouncements() {

    try {

      const loggedIn =
        await checkUser();


      if (!loggedIn) {
        return;
      }


      const {
        data,
        error
      } =
      await supabaseClient
        .from("techsavvy_announcements")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        throw error;

      }


      loading.style.display =
        "none";

      announcementList.style.display =
        "grid";


      if (
        !data ||
        data.length === 0
      ) {

        announcementList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              📢
            </div>

            <h2>
              No announcements yet
            </h2>

            <p>
              Kwa sasa hakuna matangazo mapya.
              Rudi tena baadaye kupata updates
              kutoka Techsavvy Tanzania.
            </p>

          </div>
        `;

        return;

      }


      announcementList.innerHTML =
        data.map(
          announcement => {

            const date =
              announcement.created_at
                ? new Date(
                    announcement.created_at
                  ).toLocaleDateString(
                    "en-GB",
                    {
                      day: "2-digit",
                      month: "short",
                      year: "numeric"
                    }
                  )
                : "";


            return `

              <article class="announcement">

                <div class="announcement-top">

                  <div class="announcement-icon">
                    ${announcement.icon || "📢"}
                  </div>

                  <div class="announcement-content">

                    <h2>
                      ${escapeHtml(
                        announcement.title || "Announcement"
                      )}
                    </h2>

                    <p>
                      ${escapeHtml(
                        announcement.content || ""
                      )}
                    </p>

                  </div>

                </div>

                <div class="meta">

                  <span class="tag">
                    ${escapeHtml(
                      announcement.type || "General"
                    )}
                  </span>

                  <span>
                    ${date}
                  </span>

                </div>

              </article>

            `;

          }
        ).join("");


    } catch (error) {

      console.error(
        "Announcements error:",
        error
      );


      loading.style.display =
        "none";

      announcementList.style.display =
        "grid";


      announcementList.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            📢
          </div>

          <h2>
            Announcements bado hazijawekwa
          </h2>

          <p>
            Mfumo wa announcements umeandaliwa.
            Tutauunganisha na database ya Techsavvy.
          </p>

        </div>

      `;

    }

  }


  /* ==========================================
     SECURITY
     ========================================== */

  function escapeHtml(value) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* ==========================================
     LOGOUT
     ========================================== */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
          "login.html";

      }
    );


  /* ==========================================
     START
     ========================================== */

  loadAnnouncements();

</script>

</body>
</html>
