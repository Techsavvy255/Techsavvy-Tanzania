<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Techsavvy Tanzania</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top left,
          rgba(35, 91, 255, 0.25),
          transparent 35%
        ),
        #050505;

      color: #fff;

      font-family: "Inter", sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;

      background: #0d0d0d;

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 22px;

      padding: 45px;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.55);
    }

    .logo {
      text-align: center;

      font-family: "Space Grotesk", sans-serif;

      font-size: 24px;

      font-weight: 700;

      letter-spacing: 1px;

      margin-bottom: 40px;
    }

    .logo span {
      color: #3974ff;
    }

    .icon {
      width: 70px;
      height: 70px;

      margin: 0 auto 25px;

      border-radius: 50%;

      background: rgba(50,105,255,0.12);

      border: 1px solid rgba(50,105,255,0.25);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
    }

    h1 {
      text-align: center;

      font-family: "Space Grotesk", sans-serif;

      font-size: 32px;

      margin-bottom: 12px;
    }

    .subtitle {
      text-align: center;

      color: #888;

      font-size: 14px;

      line-height: 1.7;

      margin-bottom: 30px;
    }

    .message {
      display: none;

      padding: 13px;

      border-radius: 9px;

      margin-bottom: 20px;

      font-size: 13px;

      line-height: 1.5;
    }

    .message.error {
      display: block;

      background: rgba(220,50,50,0.1);

      border: 1px solid rgba(220,50,50,0.25);

      color: #ff8585;
    }

    .message.success {
      display: block;

      background: rgba(40,190,110,0.1);

      border: 1px solid rgba(40,190,110,0.25);

      color: #68dda0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #ddd;

      font-size: 13px;

      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;

      height: 52px;

      padding: 0 50px 0 16px;

      border-radius: 10px;

      border: 1px solid #292929;

      outline: none;

      background: #121212;

      color: white;

      font-family: inherit;

      transition: 0.3s;
    }

    input:focus {
      border-color: #3670ff;

      box-shadow:
        0 0 0 3px rgba(54,112,255,0.1);
    }

    .toggle {
      position: absolute;

      right: 15px;

      top: 50%;

      transform: translateY(-50%);

      color: #777;

      font-size: 12px;

      cursor: pointer;

      user-select: none;
    }

    button {
      width: 100%;

      height: 52px;

      border: none;

      border-radius: 10px;

      background: #2864e8;

      color: white;

      font-family: inherit;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.3s;
    }

    button:hover {
      background: #1d53c8;

      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 25px;

      color: #777;

      text-decoration: none;

      font-size: 13px;
    }

    .back:hover {
      color: #aaa;
    }

    .requirements {
      margin-top: 10px;

      color: #666;

      font-size: 12px;

      line-height: 1.6;
    }

    @media (max-width: 500px) {

      .container {
        padding: 35px 22px;
      }

      h1 {
        font-size: 28px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      TECH<span>SAVVY</span>
    </div>

    <div class="icon">
      🔐
    </div>

    <h1>
      Reset Password
    </h1>

    <p class="subtitle">
      Weka password mpya ya akaunti yako ya
      Techsavvy Tanzania.
    </p>

    <div id="message" class="message"></div>


    <form id="resetForm">

      <div class="form-group">

        <label for="password">
          New Password
        </label>

        <div class="input-wrapper">

          <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="6"
            required
            autocomplete="new-password"
          >

          <span
            class="toggle"
            id="togglePassword"
          >
            Show
          </span>

        </div>

        <div class="requirements">
          Password iwe na angalau characters 6.
        </div>

      </div>


      <div class="form-group">

        <label for="confirmPassword">
          Confirm New Password
        </label>

        <div class="input-wrapper">

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="6"
            required
            autocomplete="new-password"
          >

          <span
            class="toggle"
            id="toggleConfirm"
          >
            Show
          </span>

        </div>

      </div>


      <button
        type="submit"
        id="resetButton"
      >
        Update Password
      </button>

    </form>


    <a
      href="login.html"
      class="back"
    >
      ← Back to Login
    </a>

  </div>


<script>

  /* ==========================================
     SUPABASE
     ========================================== */

  const SUPABASE_URL =
    "WEKA_SUPABASE_URL_HAPA";

  const SUPABASE_KEY =
    "WEKA_SUPABASE_PUBLISHABLE_KEY_HAPA";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     ELEMENTS
     ========================================== */

  const form =
    document.getElementById("resetForm");

  const password =
    document.getElementById("password");

  const confirmPassword =
    document.getElementById("confirmPassword");

  const button =
    document.getElementById("resetButton");

  const message =
    document.getElementById("message");


  /* ==========================================
     MESSAGE
     ========================================== */

  function showMessage(
    text,
    type = "error"
  ) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  function clearMessage() {

    message.textContent = "";

    message.className = "message";

  }


  /* ==========================================
     SHOW / HIDE PASSWORD
     ========================================== */

  document
    .getElementById("togglePassword")
    .addEventListener(
      "click",
      function () {

        if (
          password.type === "password"
        ) {

          password.type = "text";

          this.textContent = "Hide";

        } else {

          password.type = "password";

          this.textContent = "Show";

        }

      }
    );


  document
    .getElementById("toggleConfirm")
    .addEventListener(
      "click",
      function () {

        if (
          confirmPassword.type === "password"
        ) {

          confirmPassword.type = "text";

          this.textContent = "Hide";

        } else {

          confirmPassword.type = "password";

          this.textContent = "Show";

        }

      }
    );


  /* ==========================================
     UPDATE PASSWORD
     ========================================== */

  form.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      clearMessage();


      const newPassword =
        password.value;

      const confirm =
        confirmPassword.value;


      /* PASSWORD LENGTH */

      if (newPassword.length < 6) {

        showMessage(
          "Password lazima iwe na angalau characters 6."
        );

        return;

      }


      /* PASSWORD MATCH */

      if (newPassword !== confirm) {

        showMessage(
          "Passwords hazifanani."
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "Updating...";


      try {

        const {
          error
        } =
        await supabaseClient.auth
          .updateUser({
            password: newPassword
          });


        if (error) {

          throw error;

        }


        showMessage(
          "Password imebadilishwa successfully! Utapelekwa Login...",
          "success"
        );


        setTimeout(
          function () {

            window.location.href =
              "login.html";

          },
          1800
        );


      } catch (error) {

        console.error(
          "Password update error:",
          error
        );


        showMessage(
          error.message ||
          "Imeshindikana kubadilisha password."
        );


        button.disabled = false;

        button.textContent =
          "Update Password";

      }

    }
  );

</script>

</body>
</html>
