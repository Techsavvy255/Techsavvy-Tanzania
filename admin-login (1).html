<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Techsavvy Tanzania</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Techsavvy Tanzania" class="brand-logo"></a>
  </div>
</header>

<main>
  <section class="section" style="padding-top:70px;">
    <div class="wrap form-card">
      <span class="pill">Admin</span>
      <h1>Admin Login</h1>
      <form id="login-form" style="margin-top:20px;">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="form-submit">Log In</button>
        <p class="form-status" id="login-status"></p>
      </form>
    </div>
  </section>
</main>

<script src="assets/supabase-config.js"></script>
<script src="assets/admin-auth.js"></script>
</body>
</html>
