<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Techsavvy Tanzania</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Techsavvy Tanzania" class="brand-logo"></a>
    <button id="logout-btn" class="btn btn-outline" style="padding:8px 16px;">Log Out</button>
  </div>
</header>

<main>
  <section class="section" style="padding-top:40px;">
    <div class="wrap">
      <span class="pill">Admin Dashboard</span>
      <h1>Applications Overview</h1>

      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num" id="stat-total">–</div><div class="stat-label">Total</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-pending">–</div><div class="stat-label">Pending</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-review">–</div><div class="stat-label">Under Review</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-interview">–</div><div class="stat-label">Interview</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-approved">–</div><div class="stat-label">Approved</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-rejected">–</div><div class="stat-label">Rejected</div></div>
      </div>

      <div class="filter-bar">
        <select id="filter-category">
          <option value="">All Categories</option>
          <option value="learner">Learner</option>
          <option value="team_member">Team Member</option>
          <option value="volunteer">Volunteer</option>
          <option value="mentor">Mentor</option>
          <option value="partner">Partner</option>
          <option value="sponsor">Sponsor</option>
        </select>
        <select id="filter-status">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="under_review">Under Review</option>
          <option value="interview">Interview</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
        <input type="text" id="filter-search" placeholder="Search name or email...">
      </div>

      <div style="overflow-x:auto;">
        <table class="app-table">
          <thead>
            <tr>
              <th>App #</th><th>Name</th><th>Category</th><th>Email</th><th>Status</th><th>Date</th>
            </tr>
          </thead>
          <tbody id="app-table-body">
            <tr><td colspan="6">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<!-- Detail modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <span class="modal-close" id="modal-close">&times;</span>
    <div id="modal-content"></div>
  </div>
</div>

<script src="assets/supabase-config.js"></script>
<script>
let allApplications = [];

const statusLabels = {
  pending: "Pending",
  under_review: "Under Review",
  interview: "Interview",
  approved: "Approved",
  rejected: "Rejected",
};

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

// --- Auth guard: must be logged in AND registered as an admin ---
(async function guard() {
  const tbody = document.getElementById("app-table-body");
  try {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = "admin-login.html";
      return;
    }
    const { data: isAdmin, error } = await supabaseClient.rpc("is_admin");
    if (error) throw error;
    if (!isAdmin) {
      tbody.innerHTML = '<tr><td colspan="6">This account does not have admin access.</td></tr>';
      return;
    }
    loadApplications();
  } catch (err) {
    tbody.innerHTML =
      '<tr><td colspan="6">Could not verify admin access: ' +
      escapeHtml(err && err.message ? err.message : err) +
      "</td></tr>";
  }
})();

document.getElementById("logout-btn").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "admin-login.html";
});

async function loadApplications() {
  const { data, error } = await supabaseClient
    .from("applications")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    document.getElementById("app-table-body").innerHTML =
      '<tr><td colspan="6">Error loading applications: ' + escapeHtml(error.message) + "</td></tr>";
    return;
  }

  allApplications = data || [];
  updateStats();
  renderTable();
}

function updateStats() {
  const count = (s) => allApplications.filter((a) => a.status === s).length;
  document.getElementById("stat-total").textContent = allApplications.length;
  document.getElementById("stat-pending").textContent = count("pending");
  document.getElementById("stat-review").textContent = count("under_review");
  document.getElementById("stat-interview").textContent = count("interview");
  document.getElementById("stat-approved").textContent = count("approved");
  document.getElementById("stat-rejected").textContent = count("rejected");
}

function renderTable() {
  const category = document.getElementById("filter-category").value;
  const status = document.getElementById("filter-status").value;
  const search = document.getElementById("filter-search").value.toLowerCase();

  const rows = allApplications.filter((a) => {
    if (category && a.category !== category) return false;
    if (status && a.status !== status) return false;
    if (search && !(a.full_name.toLowerCase().includes(search) || a.email.toLowerCase().includes(search))) return false;
    return true;
  });

  const tbody = document.getElementById("app-table-body");
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6">No applications match your filters.</td></tr>';
    return;
  }

  tbody.innerHTML = rows
    .map(
      (a) => `
      <tr data-id="${escapeHtml(a.id)}">
        <td>${escapeHtml(a.application_number || "—")}</td>
        <td>${escapeHtml(a.full_name)}</td>
        <td>${escapeHtml(a.category.replace("_", " "))}</td>
        <td>${escapeHtml(a.email)}</td>
        <td><span class="status-badge status-${escapeHtml(a.status)}">${escapeHtml(statusLabels[a.status] || a.status)}</span></td>
        <td>${new Date(a.created_at).toLocaleDateString()}</td>
      </tr>`
    )
    .join("");

  document.querySelectorAll("#app-table-body tr[data-id]").forEach((tr) => {
    tr.addEventListener("click", () => openDetail(tr.dataset.id));
  });
}

["filter-category", "filter-status", "filter-search"].forEach((id) => {
  document.getElementById(id).addEventListener("input", renderTable);
});

const SITE_URL = "https://techsavvy255.github.io/Techsavvy-Tanzania/";

const statusNotes = {
  pending: "We have received it and will review it soon.",
  under_review: "Our team has started reviewing it.",
  interview: "We would like to invite you to an interview and will share the details soon.",
  approved: "Congratulations, your application has been approved!",
  rejected: "Thank you for applying. We are not able to move forward with your application at this time.",
};

// Turns 0659 812 079, +255659812079 or 659812079 into 255659812079 (the form WhatsApp links need)
function normalizePhone(raw) {
  let d = String(raw || "").replace(/[^\d+]/g, "");
  if (!d) return "";
  if (d.charAt(0) === "+") d = d.slice(1);
  else if (d.indexOf("00") === 0) d = d.slice(2);
  else if (d.charAt(0) === "0") d = "255" + d.slice(1);
  if (/^[67]\d{8}$/.test(d)) d = "255" + d; // a Tanzanian mobile number written without 0 or country code
  return /^\d{9,15}$/.test(d) ? d : "";
}

function notifyMessage(app, status) {
  return (
    "Hello " + app.full_name + ", this is Techsavvy Tanzania. Your application " + app.application_number +
    " is now: " + (statusLabels[status] || status) + ". " + (statusNotes[status] || "") +
    " You can follow it any time here: " + SITE_URL + "track.html?number=" + encodeURIComponent(app.application_number)
  );
}

// Keeps the WhatsApp / Email buttons in step with the status currently chosen in the form
function updateNotify(app) {
  const status = document.getElementById("status-select").value;
  const msg = notifyMessage(app, status);
  const wa = document.getElementById("notify-wa");
  const phone = normalizePhone(app.phone);
  if (phone) {
    wa.setAttribute("href", "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg));
    wa.style.display = "";
  } else {
    wa.style.display = "none";
  }
  document.getElementById("notify-mail").setAttribute(
    "href",
    "mailto:" + encodeURIComponent(app.email) +
      "?subject=" + encodeURIComponent("Your Techsavvy Tanzania application " + app.application_number) +
      "&body=" + encodeURIComponent(msg)
  );
  document.getElementById("notify-hint").textContent = phone
    ? "Opens WhatsApp or your email app with a ready message about the selected status. Read it, then press send."
    : "No usable phone number on this application, so only email is available. Opens your email app with a ready message.";
}

function openDetail(id) {
  const app = allApplications.find((a) => a.id === id);
  if (!app) return;

  const detailsHtml = Object.entries(app.details || {})
    .filter(([, v]) => v)
    .map(
      ([k, v]) =>
        `<div class="track-row"><span>${escapeHtml(k.replace(/_/g, " "))}</span><span>${escapeHtml(v)}</span></div>`
    )
    .join("");

  document.getElementById("modal-content").innerHTML = `
    <h2>${escapeHtml(app.full_name)}</h2>
    <p style="color:var(--grey);">${escapeHtml(app.application_number)} &middot; ${escapeHtml(app.category.replace("_", " "))}</p>

    <div class="track-result" style="margin-top:16px;">
      <div class="track-row"><span>Email</span><span>${escapeHtml(app.email)}</span></div>
      <div class="track-row"><span>Phone</span><span>${escapeHtml(app.phone || "—")}</span></div>
      ${detailsHtml}
    </div>

    <div class="field" style="margin-top:20px;">
      <label>Status</label>
      <select id="status-select">
        <option value="pending" ${app.status === "pending" ? "selected" : ""}>Pending</option>
        <option value="under_review" ${app.status === "under_review" ? "selected" : ""}>Under Review</option>
        <option value="interview" ${app.status === "interview" ? "selected" : ""}>Interview</option>
        <option value="approved" ${app.status === "approved" ? "selected" : ""}>Approved</option>
        <option value="rejected" ${app.status === "rejected" ? "selected" : ""}>Rejected</option>
      </select>
    </div>

    <div class="field">
      <label>Internal Notes</label>
      <textarea id="notes-input">${escapeHtml(app.admin_notes || "")}</textarea>
    </div>

    <div class="field" style="margin-top:24px;">
      <label>Tell the applicant</label>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a id="notify-wa" class="btn btn-outline" style="padding:10px 18px;" target="_blank" rel="noopener">WhatsApp</a>
        <a id="notify-mail" class="btn btn-outline" style="padding:10px 18px;">Email</a>
      </div>
      <div class="field-hint" id="notify-hint"></div>
    </div>

    <button class="form-submit" id="save-btn">Save Changes</button>
    <p class="form-status" id="modal-status"></p>
  `;

  document.getElementById("save-btn").addEventListener("click", () => saveChanges(app.id));
  document.getElementById("status-select").addEventListener("change", () => updateNotify(app));
  updateNotify(app);
  document.getElementById("modal-overlay").classList.add("open");
}

async function saveChanges(id) {
  const status = document.getElementById("status-select").value;
  const notes = document.getElementById("notes-input").value;
  const modalStatus = document.getElementById("modal-status");
  modalStatus.textContent = "Saving...";
  modalStatus.className = "form-status";

  const app = allApplications.find((a) => a.id === id);

  const { error } = await supabaseClient
    .from("applications")
    .update({ status, admin_notes: notes })
    .eq("id", id);

  if (error) {
    modalStatus.textContent = "Error: " + error.message;
    modalStatus.className = "form-status error";
    return;
  }

  modalStatus.textContent = "Saved.";
  modalStatus.className = "form-status success";

  // Fire-and-forget status update email (does not block the dashboard if it fails)
  if (app) {
    supabaseClient.functions
      .invoke("send-status-email", {
        body: {
          email: app.email,
          full_name: app.full_name,
          application_number: app.application_number,
          status: status,
        },
      })
      .catch((err) => console.warn("Status email failed to send:", err));
  }

  await loadApplications();
  setTimeout(() => document.getElementById("modal-overlay").classList.remove("open"), 600);
}

document.getElementById("modal-close").addEventListener("click", () => {
  document.getElementById("modal-overlay").classList.remove("open");
});
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") e.target.classList.remove("open");
});
</script>
</body>
</html>
