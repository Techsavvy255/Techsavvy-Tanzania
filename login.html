<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Techsavvy Tanzania</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, #123d91 0, transparent 35%),
                #050505;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 55px;
            height: 55px;
            background: #155eef;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: "Space Grotesk";
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .brand h1 {
            font-family: "Space Grotesk";
            font-size: 25px;
        }

        .brand span {
            color: #3977ff;
        }

        .brand p {
            color: #9ca3af;
            font-size: 13px;
            margin-top: 7px;
        }

        .login-card {
            background: white;
            color: #111827;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0,0,0,.35);
        }

        .login-card h2 {
            font-family: "Space Grotesk";
            font-size: 27px;
            margin-bottom: 8px;
        }

        .login-card > p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            transition: .2s;
        }

        input:focus {
            border-color: #155eef;
            box-shadow: 0 0 0 3px rgba(21,94,239,.1);
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #155eef;
            color: white;
            padding: 15px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #0d4dcc;
        }

        .login-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #6b7280;
        }

        .register a {
            color: #155eef;
            font-weight: 700;
            text-decoration: none;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 13px;
        }

    </style>

</head>


<body>

<div class="login-container">


    <div class="brand">

        <div class="logo">
            T
        </div>

        <h1>
            TECH<span>SAVVY</span>
        </h1>

        <p>
            Empowering Youth Through Technology
        </p>

    </div>


    <div class="login-card">

        <h2>
            Welcome back
        </h2>

        <p>
            Login to access your Techsavvy dashboard.
        </p>


        <div
            id="message"
            class="message">
        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn">

                Login to Dashboard

            </button>

        </form>


        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>


    <div class="back">

        <a href="index.html">
            ← Back to Techsavvy Tanzania
        </a>

    </div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /*
     * ==========================================
     * TECHSAVVY SUPABASE CONFIGURATION
     * ==========================================
     *
     * WE WILL PUT YOUR SUPABASE DETAILS HERE
     * AFTER CREATING THE PROJECT.
     */

    const SUPABASE_URL =
        "YOUR_SUPABASE_URL";

    const SUPABASE_KEY =
        "YOUR_SUPABASE_PUBLISHABLE_KEY";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const loginForm =
        document.getElementById("loginForm");

    const message =
        document.getElementById("message");

    const loginBtn =
        document.getElementById("loginBtn");


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document.getElementById("email")
                .value
                .trim();


            const password =
                document.getElementById("password")
                .value;


            loginBtn.disabled = true;

            loginBtn.textContent =
                "Logging in...";


            const {
                data,
                error
            } = await supabaseClient.auth
                .signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                showMessage(
                    error.message,
                    "error"
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login to Dashboard";

                return;

            }


            showMessage(
                "Login successful. Redirecting...",
                "success"
            );


            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 1000);

        }
    );

</script>

</body>

</html>
