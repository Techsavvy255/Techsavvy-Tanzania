<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Login to your Techsavvy Tanzania member account.">

    <title>Member Login | Techsavvy Tanzania</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <div class="logo-box">T</div>

        <div class="logo-text">
            TECH<span>SAVVY</span>
        </div>
    </a>

    <nav class="nav-menu">
        <a href="index.html">Home</a>
        <a href="articles.html">Articles</a>
        <a href="join.html">Join Us</a>
    </nav>

</header>


<main class="auth-page">

    <div class="auth-container">

        <div class="auth-header">

            <div class="auth-logo">
                T
            </div>

            <span class="section-label">
                MEMBER PORTAL
            </span>

            <h1>
                Welcome <span>Back.</span>
            </h1>

            <p>
                Login to access your Techsavvy Tanzania member dashboard.
            </p>

        </div>


        <form id="loginForm" class="auth-form">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                    >
                        Show
                    </button>

                </div>

            </div>


            <div class="auth-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span>
                        Remember me
                    </span>

                </label>

                <a href="#" id="forgotPassword">
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="btn primary auth-submit"
            >
                Login to Dashboard →
            </button>


            <div
                id="loginMessage"
                class="auth-message"
            ></div>

        </form>


        <div class="auth-footer">

            <p>
                Don't have a Techsavvy account?
            </p>

            <a href="join.html">
                Become a Member →
            </a>

        </div>

    </div>

</main>


<footer>

    <div class="footer-brand">

        <div class="logo-box">
            T
        </div>

        <div class="logo-text">
            TECH<span>SAVVY</span>
        </div>

    </div>

    <p>
        © 2026 Techsavvy Tanzania.
        Empowering Youth Through Technology.
    </p>

    <a href="index.html">
        Back to website ↑
    </a>

</footer>


<script>

const loginForm =
    document.getElementById("loginForm");

const password =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");

const loginMessage =
    document.getElementById("loginMessage");


togglePassword.addEventListener("click", function () {

    if (password.type === "password") {

        password.type = "text";
        togglePassword.textContent = "Hide";

    } else {

        password.type = "password";
        togglePassword.textContent = "Show";

    }

});


loginForm.addEventListener("submit", function (event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const passwordValue =
        password.value.trim();


    if (!email || !passwordValue) {

        loginMessage.textContent =
            "Please enter your email and password.";

        loginMessage.className =
            "auth-message error";

        return;

    }


    /*
      TEMPORARY LOGIN

      Supabase authentication will be connected
      in the next step.
    */

    loginMessage.textContent =
        "Login system is ready. Database authentication will be connected next.";

    loginMessage.className =
        "auth-message success";

});

</script>

</body>
</html>
