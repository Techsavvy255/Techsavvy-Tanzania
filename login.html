<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Techsavvy Tanzania</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<input type="checkbox" id="nav-toggle" class="nav-toggle">
<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Techsavvy Tanzania" class="brand-logo"></a>
    <label for="nav-toggle" class="nav-burger" aria-label="Open menu"><span></span><span></span><span></span></label>
    <nav class="main-nav">
      <a href="about.html">About</a>
      <a href="courses.html">Courses</a>
      <a href="register.html">Register</a>
      <a href="join.html" class="nav-cta">Join Us</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="pill">Member Login</span>
      <h1>Welcome <em>Back</em></h1>
      <p>Log in to access your dashboard.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap form-card">
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="form-submit">Log In</button>
        <p class="form-status" id="login-status"></p>
      </form>
      <p style="margin-top:16px; text-align:center; color:var(--grey);">
        Don't have an account? <a href="register.html" style="color:var(--blue); font-weight:600;">Create one</a>
      </p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom"><p>&copy; 2026 Techsavvy Tanzania. All rights reserved.</p></div>
</footer>

<script src="assets/supabase-config.js"></script>
<script src="assets/member-login.js"></script>
</body>
</html>
