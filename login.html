<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Ingia na Google - Techsavvy Tanzania</title>
    <!-- 1. Hapa tunaita maktaba ya Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <h2>Karibu Techsavvy Tanzania</h2>

    <!-- 2. Hapa ndipo kitufe cha Google kitakapojichora chenyewe -->
    <div id="g_id_onload"
         data-client_id="516536582111-06mm....apps.googleusercontent.com"
         data-callback="kaziIkamilika">
    </div>
    
    <div class="g_id_signin" 
         data-type="standard" 
         data-size="large" 
         data-theme="outline">
    </div>

    <!-- 3. Hapa tunasubiri mtumiaji akibofya na kuingia -->
    <script>
        function kaziIkamilika(response) {
            console.log("Token ya mtumiaji ni hii hapa:");
            console.log(response.credential);
            
            alert("Umeingia mafanikio! Angalia kwenye Console (F12) kuona taarifa zako.");
        }
    </script>

</body>
</html>
