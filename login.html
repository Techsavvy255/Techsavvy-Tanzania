<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Member Login | Techsavvy Tanzania</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-box {
            width: 55px;
            height: 55px;
            background: #155eef;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 28px;
            font-weight: 800;
            border-radius: 12px;
        }

        .brand h1 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 25px;
        }

        .brand h1 span {
            color: #155eef;
        }

        .brand p {
            color: #999;
            margin-top: 8px;
            font-size: 14px;
        }

        .login-card {
            background: #111111;
            border: 1px solid #252525;
            border-radius: 18px;
            padding: 35px;
        }

        .login-card h2 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-card > p {
            color: #999;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 9px;
            border: 1px solid #333;
            background: #080808;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #155eef;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #155eef;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .login-btn:hover {
            opacity: .9;
        }

        .login-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .error {
            background: #351414;
            color: #ff8b8b;
            border: 1px solid #642222;
        }

        .success {
            background: #12351d;
            color: #8df0a2;
            border: 1px solid #245c31;
        }

        .bottom-text {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 14px;
        }

        .bottom-text a {
            color: #4d8aff;
            text-decoration: none;
            font-weight: 600;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="brand">

            <div class="logo-box">
                T
            </div>

            <h1>
                TECH<span>SAVVY</span>
            </h1>

            <p>Empowering Youth Through Technology</p>

        </div>


        <div class="login-card">

            <h2>Member Login</h2>

            <p>Login to access your Techsavvy account.</p>


            <div id="errorMessage" class="message error"></div>

            <div id="successMessage" class="message success"></div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <div class="bottom-text">

                Don't have an account?

                <a href="join.html">
                    Join Techsavvy
                </a>

            </div>

        </div>


        <a href="index.html" class="back">
            ← Back to Techsavvy Tanzania
        </a>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL = "WEKA_SUPABASE_URL_HAPA";

        const SUPABASE_KEY = "WEKA_SUPABASE_PUBLISHABLE_KEY_HAPA";


        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        const loginForm = document.getElementById("loginForm");

        const loginButton = document.getElementById("loginButton");

        const errorMessage = document.getElementById("errorMessage");

        const successMessage = document.getElementById("successMessage");


        loginForm.addEventListener("submit", async function (e) {

            e.preventDefault();


            errorMessage.style.display = "none";

            successMessage.style.display = "none";


            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            loginButton.disabled = true;

            loginButton.textContent = "Logging in...";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                errorMessage.textContent =
                    error.message;

                errorMessage.style.display = "block";

                loginButton.disabled = false;

                loginButton.textContent = "Login";

                return;
            }


            successMessage.textContent =
                "Login successful. Opening dashboard...";

            successMessage.style.display = "block";


            setTimeout(function () {

                window.location.href =
                    "dashboard.html";

            }, 1000);

        });

    </script>

</body>

</html>
