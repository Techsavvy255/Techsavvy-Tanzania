<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Application — Techsavvy Tanzania</title>
<meta name="description" content="Track the status of your Techsavvy Tanzania application using your Application Number.">
<link rel="canonical" href="https://techsavvy255.github.io/Techsavvy-Tanzania/track.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Track Application — Techsavvy Tanzania">
<meta property="og:description" content="Track the status of your Techsavvy Tanzania application using your Application Number.">
<meta property="og:url" content="https://techsavvy255.github.io/Techsavvy-Tanzania/track.html">
<meta property="og:image" content="https://techsavvy255.github.io/Techsavvy-Tanzania/assets/logo.png">
<meta property="og:site_name" content="Techsavvy Tanzania">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Track Application — Techsavvy Tanzania">
<meta name="twitter:description" content="Track the status of your Techsavvy Tanzania application using your Application Number.">
<meta name="twitter:image" content="https://techsavvy255.github.io/Techsavvy-Tanzania/assets/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<input type="checkbox" id="nav-toggle" class="nav-toggle">
<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Techsavvy Tanzania" class="brand-logo"></a>
    <label for="nav-toggle" class="nav-burger" aria-label="Open menu"><span></span><span></span><span></span></label>
    <nav class="main-nav">
      <a href="about.html">About</a>
      <a href="programs.html">Programs</a>
      <a href="courses.html">Courses</a>
      <a href="projects.html">Projects</a>
      <a href="join.html" class="nav-cta">Join Us</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="pill">Track Status</span>
      <h1>Check Your <em>Application</em> Status</h1>
      <p>Enter the Application Number you received after submitting your application.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap form-card">
      <form id="track-form">
        <div class="field">
          <label for="app_number">Application Number</label>
          <input type="text" id="app_number" placeholder="e.g. TS-2026-A1B2C3" required>
        </div>
        <button type="submit" class="form-submit">Check Status</button>
        <p class="form-status" id="track-status"></p>
      </form>

      <div id="track-result" class="track-result" style="display:none;">
        <div class="track-row"><span>Application Number</span><span id="r-number"></span></div>
        <div class="track-row"><span>Category</span><span id="r-category"></span></div>
        <div class="track-row"><span>Name</span><span id="r-name"></span></div>
        <div class="track-row"><span>Status</span><span id="r-status"></span></div>
        <div class="track-row"><span>Submitted</span><span id="r-date"></span></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom"><p>&copy; 2026 Techsavvy Tanzania. All rights reserved.</p></div>
</footer>

<script src="assets/supabase-config.js"></script>
<script>
// Tracking logic is inside this page, so there is no separate track.js to go missing.
const statusLabels = {
  pending: "Pending",
  under_review: "Under Review",
  interview: "Interview",
  approved: "Approved",
  rejected: "Rejected",
};

document.getElementById("track-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const statusEl = document.getElementById("track-status");
  const resultEl = document.getElementById("track-result");
  const number = document.getElementById("app_number").value.trim().toUpperCase();

  statusEl.textContent = "";
  statusEl.className = "form-status";
  resultEl.style.display = "none";

  if (!number) return;

  statusEl.textContent = "Checking...";

  try {
    const { data, error } = await supabaseClient.rpc("track_application", { p_number: number });
    if (error) throw error;

    const rows = Array.isArray(data) ? data : data ? [data] : [];
    if (rows.length === 0) {
      statusEl.textContent = "No application found with that number. Please check and try again.";
      statusEl.className = "form-status error";
      return;
    }

    const app = rows[0];
    statusEl.textContent = "";
    document.getElementById("r-number").textContent = app.application_number;
    document.getElementById("r-category").textContent = app.category.replace("_", " ");
    document.getElementById("r-name").textContent = app.full_name;
    document.getElementById("r-date").textContent = new Date(app.created_at).toLocaleDateString();

    const badge = document.createElement("span");
    badge.className = "status-badge status-" + app.status;
    badge.textContent = statusLabels[app.status] || app.status;
    const statusCell = document.getElementById("r-status");
    statusCell.innerHTML = "";
    statusCell.appendChild(badge);

    resultEl.style.display = "block";
  } catch (err) {
    console.error(err);
    const reason = err && err.message ? " (Technical details: " + err.message + ")" : "";
    statusEl.textContent = "Something went wrong. Please try again later." + reason;
    statusEl.className = "form-status error";
  }
});
</script>
</body>
</html>
