<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Join Techsavvy Tanzania and become part of a community learning and building with technology.">

    <title>Register | Techsavvy Tanzania</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top right,
                    #123d91 0,
                    transparent 35%
                ),
                #050505;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 55px;
            height: 55px;

            background: #155eef;

            border-radius: 12px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            font-family: "Space Grotesk";
            font-size: 28px;
            font-weight: 800;

            margin-bottom: 12px;
        }

        .brand h1 {
            font-family: "Space Grotesk";
            font-size: 25px;
        }

        .brand h1 span {
            color: #3977ff;
        }

        .brand p {
            color: #9ca3af;
            font-size: 13px;
            margin-top: 7px;
        }

        .card {
            background: white;
            color: #111827;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.35);
        }

        .card h2 {
            font-family: "Space Grotesk";
            font-size: 27px;
            margin-bottom: 8px;
        }

        .intro {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;

            padding: 14px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            outline: none;

            font-size: 14px;

            background: white;
        }

        input:focus,
        select:focus {
            border-color: #155eef;

            box-shadow:
                0 0 0 3px rgba(21,94,239,.1);
        }

        .register-btn {
            width: 100%;

            border: none;

            background: #155eef;
            color: white;

            padding: 15px;

            border-radius: 9px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            margin-top: 8px;
        }

        .register-btn:hover {
            background: #0d4dcc;
        }

        .register-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;

            padding: 12px;

            border-radius: 8px;

            font-size: 13px;

            margin-bottom: 18px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;

            background: #dcfce7;
            color: #166534;
        }

        .login {
            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #6b7280;
        }

        .login a {
            color: #155eef;

            font-weight: 700;

            text-decoration: none;
        }

        .back {
            text-align: center;

            margin-top: 20px;
        }

        .back a {
            color: #9ca3af;

            text-decoration: none;

            font-size: 13px;
        }

        .password-note {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 6px;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- BRAND -->

    <div class="brand">

        <div class="logo">
            T
        </div>

        <h1>
            TECH<span>SAVVY</span>
        </h1>

        <p>
            Empowering Youth Through Technology
        </p>

    </div>


    <!-- REGISTER CARD -->

    <div class="card">

        <h2>
            Create your account
        </h2>

        <p class="intro">
            Join Techsavvy Tanzania and access
            your learning dashboard.
        </p>


        <div
            id="message"
            class="message">
        </div>


        <form id="registerForm">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required>

            </div>


            <!-- INTEREST -->

            <div class="form-group">

                <label for="interest">
                    Area of Interest
                </label>

                <select id="interest" required>

                    <option value="">
                        Select your interest
                    </option>

                    <option>
                        AI & ChatGPT
                    </option>

                    <option>
                        Graphic Design
                    </option>

                    <option>
                        Web Development
                    </option>

                    <option>
                        Networking
                    </option>

                    <option>
                        Cybersecurity
                    </option>

                    <option>
                        Digital Marketing
                    </option>

                    <option>
                        Technology & Innovation
                    </option>

                </select>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a strong password"
                    minlength="8"
                    required>

                <div class="password-note">
                    Use at least 8 characters.
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repeat your password"
                    minlength="8"
                    required>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="register-btn"
                id="registerBtn">

                Create Techsavvy Account

            </button>

        </form>


        <div class="login">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <div class="back">

        <a href="index.html">
            ← Back to Techsavvy Tanzania
        </a>

    </div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/*
==================================================
TECHSAVVY SUPABASE CONFIG
==================================================

Tutabadilisha hizi baada ya kupata
Project URL na Publishable Key yako.
*/


const SUPABASE_URL =
    "YOUR_SUPABASE_URL";


const SUPABASE_KEY =
    "YOUR_SUPABASE_PUBLISHABLE_KEY";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/*
==================================================
ELEMENTS
==================================================
*/

const registerForm =
    document.getElementById("registerForm");


const message =
    document.getElementById("message");


const registerBtn =
    document.getElementById("registerBtn");



/*
==================================================
MESSAGE
==================================================
*/

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}



/*
==================================================
REGISTER
==================================================
*/

registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const fullName =
            document
            .getElementById("fullName")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const interest =
            document
            .getElementById("interest")
            .value;


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;



        /*
        PASSWORD CHECK
        */

        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }



        if (password.length < 8) {

            showMessage(
                "Password must contain at least 8 characters.",
                "error"
            );

            return;

        }



        /*
        DISABLE BUTTON
        */

        registerBtn.disabled = true;

        registerBtn.textContent =
            "Creating account...";



        /*
        SUPABASE SIGNUP
        */

        const {
            data,
            error
        } = await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    full_name: fullName,

                    interest: interest

                },

                emailRedirectTo:
                    "https://techsavvy255.github.io/Techsavvy-Tanzania/login.html"

            }

        });



        /*
        ERROR
        */

        if (error) {

            showMessage(
                error.message,
                "error"
            );

            registerBtn.disabled = false;

            registerBtn.textContent =
                "Create Techsavvy Account";

            return;

        }



        /*
        SUCCESS
        */

        showMessage(
            "Account created successfully. Check your email to confirm your account, then login.",
            "success"
        );


        registerForm.reset();


        registerBtn.disabled = false;

        registerBtn.textContent =
            "Create Techsavvy Account";

    });


</script>


</body>

</html>
