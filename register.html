<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Techsavvy Tanzania</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<input type="checkbox" id="nav-toggle" class="nav-toggle">
<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Techsavvy Tanzania" class="brand-logo"></a>
    <label for="nav-toggle" class="nav-burger" aria-label="Open menu"><span></span><span></span><span></span></label>
    <nav class="main-nav">
      <a href="about.html">About</a>
      <a href="courses.html">Courses</a>
      <a href="login.html">Log In</a>
      <a href="join.html" class="nav-cta">Join Us</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="pill">Member Account</span>
      <h1>Create Your <em>Account</em></h1>
      <p>Register to track your progress and access your dashboard.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap form-card">
      <button type="button" id="google-btn" class="btn-google">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.8 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.4 26.7 36 24 36c-5.3 0-9.8-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.7 2.1-2.1 3.9-3.9 5.1l6.2 5.2C40.1 36.2 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <div class="auth-divider">or</div>
      <form id="register-form">
        <div class="field">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" minlength="6" required>
          <div class="field-hint">At least 6 characters.</div>
        </div>
        <button type="submit" class="form-submit">Create Account</button>
        <p class="form-status" id="register-status"></p>
      </form>
      <p style="margin-top:16px; text-align:center; color:var(--grey);">
        Already have an account? <a href="login.html" style="color:var(--blue); font-weight:600;">Log in</a>
      </p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom"><p>&copy; 2026 Techsavvy Tanzania. All rights reserved.</p></div>
</footer>

<script src="assets/supabase-config.js"></script>
<script src="register.js"></script>
</body>
</html>
